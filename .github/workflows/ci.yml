name: Monitoring Stack CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Monitoring Configuration
    runs-on: ubuntu-latest

    steps:
      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # The real Discord webhook is ignored by Git.
      # CI only needs a dummy file so Docker Compose can validate the config.
      - name: Create dummy Discord secret
        run: |
          echo "https://discord.com/api/webhooks/dummy/dummy" > discord_webhook_url

      # Validate docker-compose.yml
      - name: Validate Docker Compose
        run: |
          docker compose config > /dev/null

      # Validate prometheus.yml
      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:latest \
            check config /etc/prometheus/prometheus.yml

      # Validate alerts.yml
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:latest \
            check rules /etc/prometheus/alerts.yml

      # Validate alertmanager.yml
      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            --entrypoint /bin/amtool \
            -v "$PWD/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$PWD/discord_webhook_url:/run/secrets/discord_webhook:ro" \
            prom/alertmanager:latest \
            check-config /etc/alertmanager/alertmanager.yml

      # Check that the Grafana dashboard contains valid JSON
      - name: Validate Grafana dashboard JSON
        run: |
          jq empty grafana/dashboards/node-exporter.json

      - name: CI completed successfully
        run: |
          echo "All monitoring stack configuration checks passed."